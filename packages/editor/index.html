<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@docen/editor — demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        color: #3b3b3b;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      /* Card sizing only — the card visuals come from fluent-compound-button.
         Fill the main axis: the host centers its fit-content .content
         (justify-content: center), so a short label would hover mid-card. */
      .editors {
        display: flex;
        gap: 16px;
      }
      fluent-compound-button {
        width: 220px;
      }
      fluent-compound-button::part(content) {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>@docen/editor demos</h1>
    <script type="module" src="/demo/home.ts"></script>
  </body>
</html>
